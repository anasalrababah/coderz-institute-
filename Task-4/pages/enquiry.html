<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاستفسار عن كورس | معهد Coderz</title>
</head>

<body>

    <header>
        <h1>معهد Coderz</h1>

        <nav aria-label="التنقل الرئيسي">
            <a href="../index.html">الرئيسية</a> |
            <a href="schedule.html">المواعيد</a> |
            <a href="enquiry.html">الاستفسار</a>
        </nav>
    </header>

    <main>

        <h2>استفسر عن كورس</h2>

        <form action="#" method="get">

            <label for="fullname">الاسم الكامل:</label>
            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="مثال: أحمد محمد"
                autocomplete="name">

            <br><br>

            <label for="email">البريد الإلكتروني:</label>
            <input
                type="email"
                id="email"
                name="email">

            <br><br>

            <label for="phone">رقم الهاتف:</label>
            <input
                type="tel"
                id="phone"
                name="phone">

            <br><br>

            <label for="course">اختر الكورس:</label>
            <select id="course" name="course">
                <option value="" selected disabled>اختر كورساً</option>
                <option value="content">HTML Content</option>
                <option value="forms">HTML Forms</option>
            </select>

            <br><br>

            <label for="seats">عدد المقاعد:</label>
            <input
                type="number"
                id="seats"
                name="seats"
                value="1"
                min="1">

            <br><br>

            <label for="date">التاريخ :</label>
            <input
                type="date"
                id="date"
                name="date">
            <br><br>

            <label for="message">اكتب استفسارك:</label>
            <br>
            <textarea
                id="message"
                name="message"
                rows="5"
                cols="40"></textarea>

            <br><br>

            <button type="submit">إرسال الاستفسار</button>

        </form>

    </main>

    <footer>
        <p>© معهد Coderz - جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
