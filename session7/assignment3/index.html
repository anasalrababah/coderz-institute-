
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواعيد اللقاءات</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">

        <h1 class="page-title">مواعيد اللقاءات</h1>

        <p class="page-description">
            تابع لقاءاتك القادمة واستعد للتطبيق.
        </p>

        <!-- First Meeting -->
        <article class="meeting-card first-card">

            <span class="badge">اللقاء القادم</span>

            <h2>أساسيات HTML</h2>

            <p class="description">
                نرتب محتوى الصفحة ونستخدم العناصر المناسبة.
            </p>

            <p class="time">
                السبت - 10:00 صباحًا
            </p>

            <a href="#" class="meeting-button">
                تفاصيل اللقاء
            </a>

        </article>

        <!-- Second Meeting -->
        <article class="meeting-card second-card">

            <span class="badge">الأسبوع القادم</span>

            <h2>تنسيق الصفحات باستخدام CSS</h2>

            <p class="description">
                ننسق النصوص والألوان ونضبط المسافات.
            </p>

            <p class="time">
                الاثنين - 5:00 مساءً
            </p>

            <a href="#" class="meeting-button">
                تفاصيل اللقاء
            </a>

        </article>

    </main>

</body>
</html>
